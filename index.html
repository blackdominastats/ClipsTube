<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipsTube</title>
<style>
:root{--red:#e62117;--text:#0f0f0f;--muted:#606060;--line:#e5e5e5;--surface:#fff;--soft:#f2f2f2;--sidebar:240px}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:14px Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.top{height:56px;position:fixed;z-index:20;inset:0 0 auto;background:var(--surface);display:flex;align-items:center;gap:28px;padding:0 22px;border-bottom:1px solid #eee}.brand{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;letter-spacing:-1px;white-space:nowrap}.playmark{width:30px;height:21px;border-radius:6px;background:var(--red);display:grid;place-items:center;color:white;font-size:12px}.menu{font-size:21px}.searchbox{display:flex;max-width:640px;flex:1;margin:auto;height:34px}.searchbox input{flex:1;min-width:0;border:1px solid #bbb;padding:0 10px;font-size:16px;box-shadow:inset 0 1px 2px #ddd}.searchbox button{width:65px;border:1px solid #bbb;background:#f8f8f8;font-size:18px}.topright{display:flex;align-items:center;gap:22px;font-size:19px}.avatar{width:32px;height:32px;border-radius:50%;background:#8c65bd;color:white;display:grid;place-items:center;font-weight:600}.sidebar{position:fixed;z-index:10;top:56px;bottom:0;left:0;width:var(--sidebar);background:var(--surface);overflow:auto;padding:12px 0}.navitem{height:40px;display:flex;align-items:center;gap:24px;padding:0 24px;color:#222;font-size:14px;width:100%;text-align:left}.navitem:hover,.navitem.active{background:#eee}.navitem.active{font-weight:600}.navicon{width:20px;text-align:center;font-size:18px;color:#444}.navsep{border-top:1px solid var(--line);margin:12px 0}.navheading{padding:8px 24px;color:#606060;font-size:13px;font-weight:600;text-transform:uppercase}.main{margin:56px 0 0 var(--sidebar);padding:22px 28px 50px;min-height:calc(100vh - 56px)}.chips{display:flex;gap:10px;overflow:auto;padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}.chip{border:1px solid #ddd;border-radius:18px;padding:7px 13px;background:#f2f2f2;white-space:nowrap}.chip.active{background:#606060;color:white;border-color:#606060}.videos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 16px}.video{min-width:0;cursor:pointer}.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#ddd;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.duration{position:absolute;right:5px;bottom:5px;background:#111d;color:white;padding:3px 4px;font-size:12px;border-radius:2px}.vmeta{display:flex;gap:11px;padding-top:11px}.channelpic{width:36px;height:36px;border-radius:50%;background:#ddd;flex:none;display:grid;place-items:center;color:white;font-weight:700}.vtitle{font-weight:600;line-height:1.35;font-size:14px;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.muted{color:var(--muted);font-size:12px;line-height:1.5}.watchlayout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;max-width:1500px;margin:auto}.player{width:100%;aspect-ratio:16/9;background:#111;display:grid;place-items:center;color:white;position:relative}.player .playbig{font-size:58px;opacity:.9}.playerbar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#777}.playerbar:before{content:"";display:block;background:var(--red);height:4px;width:31%}.watchtitle{font-size:19px;font-weight:600;margin:14px 0 10px}.watchstats{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--muted)}.actions{display:flex;gap:18px}.action{font-weight:600;color:#606060}.channelrow{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.subscribe{margin-left:auto;background:var(--red);color:white;padding:10px 16px;font-weight:600}.description{padding:14px 50px 18px;font-size:13px;line-height:1.5;background:#f8f8f8}.upnext{font-weight:600;margin-bottom:12px}.suggestion{display:flex;gap:9px;margin-bottom:12px;cursor:pointer}.suggestion img{width:168px;aspect-ratio:16/9;object-fit:cover}.suggestion .vtitle{font-size:13px}.studio{margin:56px 0 0 0;min-height:calc(100vh - 56px);background:#f9f9f9}.studiohead{height:58px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 28px;gap:14px;font-size:18px;font-weight:600}.studiohead span{color:#606060;font-size:14px;font-weight:400}.studioinner{display:flex;min-height:calc(100vh - 114px)}.studioside{width:220px;background:white;border-right:1px solid #ddd;padding:18px 0;flex:none}.studioidentity{padding:4px 22px 22px;border-bottom:1px solid #eee;margin-bottom:10px}.studioidentity .channelpic{width:58px;height:58px;margin-bottom:10px}.studionav{height:44px;display:flex;align-items:center;gap:17px;padding:0 22px;width:100%;text-align:left;color:#333}.studionav:hover,.studionav.active{background:#eee;font-weight:600}.studioarea{padding:28px 34px;flex:1;min-width:0;max-width:1500px}.studiotitle{font-size:22px;font-weight:500;margin:0 0 24px}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.upload{background:#065fd4;color:white;padding:10px 16px;font-weight:600}.statsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.panel{background:white;border:1px solid #ddd;padding:18px}.panel h3{font-size:14px;margin:0 0 16px;font-weight:600}.bigstat{font-size:27px;margin:8px 0}.dashboardgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.activity{display:flex;gap:12px;padding:12px 0;border-top:1px solid #eee}.activity img{width:120px;aspect-ratio:16/9;object-fit:cover}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{text-align:left;padding:14px 12px;border-bottom:1px solid #eee;font-size:13px}.table th{color:#666;font-weight:500}.studio-tabs{display:flex;gap:24px;border-bottom:1px solid #ddd;margin-bottom:18px;color:#555}.studio-tabs span{padding:12px 2px;cursor:pointer}.studio-tabs .selected{border-bottom:2px solid #333;color:#111}.empty{padding:45px;text-align:center;color:#666;background:white;border:1px solid #ddd}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 18px;border-radius:3px;z-index:50}.dark{--text:#f1f1f1;--muted:#aaa;--line:#333;--surface:#181818;--soft:#272727}.dark .navitem{color:#eee}.dark .navitem:hover,.dark .navitem.active,.dark .chip{background:#333;color:#eee}.dark .description,.dark .searchbox button{background:#282828}.dark .searchbox input{background:#121212;color:white}.dark .studio,.dark body{background:#202020}.dark .studiohead,.dark .studioside,.dark .panel,.dark .table,.dark .empty{background:#181818;color:#eee;border-color:#333}.dark .studionav{color:#eee}.dark .studionav:hover,.dark .studionav.active{background:#333}.dark .table td,.dark .table th{border-color:#333}.dark .studio-tabs{border-color:#444}
@media(max-width:1150px){.videos{grid-template-columns:repeat(3,minmax(0,1fr))}.watchlayout{grid-template-columns:minmax(0,1fr) 320px}.suggestion img{width:130px}}
@media(max-width:800px){:root{--sidebar:72px}.sidebar{padding-top:6px}.navitem{height:65px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 0;font-size:10px}.navicon{font-size:20px}.navheading,.navsep,.sidebar .navitem:nth-of-type(n+7){display:none}.main{padding:16px}.videos{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 12px}.watchlayout{display:block}.upnext{margin-top:24px}.studioside{width:66px}.studioidentity{padding:8px 4px;text-align:center}.studioidentity .channelpic{margin:auto;width:42px;height:42px}.studioidentity strong,.studionav span{display:none}.studionav{justify-content:center;padding:0}.studioarea{padding:20px 14px}.statsgrid{grid-template-columns:1fr 1fr}.dashboardgrid{grid-template-columns:1fr}.top{gap:12px;padding:0 12px}.topright{gap:10px}.searchbox{max-width:none}.brand{font-size:17px}}
@media(max-width:520px){.videos{grid-template-columns:1fr}.topright .optional{display:none}.statsgrid{grid-template-columns:1fr}.main{margin-left:56px}.sidebar{width:56px}.watchstats{align-items:flex-start;gap:10px;flex-direction:column}.actions{flex-wrap:wrap}.description{padding:14px}.studioarea{padding:16px 10px}}
</style></head>
<body>
<header class="top"><button class="menu" id="menuBtn" aria-label="Toggle menu">☰</button><div class="brand" onclick="go('home')" style="cursor:pointer"><span class="playmark">▶</span> ClipsTube</div><form class="searchbox" id="searchForm"><input id="searchInput" placeholder="Search" aria-label="Search"><button aria-label="Search">⌕</button></form><div class="topright"><button class="optional" title="Create" onclick="toast('Upload tools are part of the Studio demo')">＋</button><button title="Toggle dark theme" onclick="document.body.classList.toggle('dark')">◐</button><button title="Open Studio" onclick="go('studio')">▣</button><div class="avatar">C</div></div></header>
<aside class="sidebar" id="sidebar">
<button class="navitem active" data-page="home" onclick="go('home')"><span class="navicon">⌂</span>Home</button>
<button class="navitem" onclick="go('trending')"><span class="navicon">♨</span>Trending</button>
<button class="navitem" onclick="go('subscriptions')"><span class="navicon">▣</span>Subscriptions</button>
<div class="navsep"></div>
<button class="navitem" onclick="go('library')"><span class="navicon">▤</span>Library</button>
<button class="navitem" onclick="go('history')"><span class="navicon">◷</span>History</button>
<button class="navitem" onclick="go('your-videos')"><span class="navicon">▹</span>Your videos</button>
<div class="navsep"></div><div class="navheading">More from ClipsTube</div>
<button class="navitem" onclick="go('studio')"><span class="navicon">▣</span>ClipsTube Studio</button>
</aside>
<main class="main" id="main"><div class="chips" id="chips"><button class="chip active" onclick="filterVideos('All')">All</button><button class="chip" onclick="filterVideos('Gaming')">Gaming</button><button class="chip" onclick="filterVideos('Music')">Music</button><button class="chip" onclick="filterVideos('Technology')">Technology</button><button class="chip" onclick="filterVideos('Entertainment')">Entertainment</button><button class="chip" onclick="filterVideos('Live')">Live</button><button class="chip" onclick="filterVideos('News')">News</button></div><div class="videos" id="videoGrid"></div></main>
<section class="studio hidden" id="studio"><div class="studiohead"><span>▣</span> ClipsTube Studio <span> / </span><span id="studioSection">Dashboard</span></div><div class="studioinner"><aside class="studioside"><div class="studioidentity"><div class="channelpic">C</div><strong>Your channel</strong><div class="muted">ClipsTube creator</div></div><button class="studionav active" onclick="studioPage('Dashboard',this)">▦ <span>Dashboard</span></button><button class="studionav" onclick="studioPage('Content',this)">▤ <span>Content</span></button><button class="studionav" onclick="studioPage('Analytics',this)">▥ <span>Analytics</span></button><button class="studionav" onclick="studioPage('Comments',this)">☷ <span>Comments</span></button><button class="studionav" onclick="studioPage('Subtitles',this)">▤ <span>Subtitles</span></button><button class="studionav" onclick="studioPage('Copyright',this)">© <span>Copyright</span></button><button class="studionav" onclick="studioPage('Monetization',this)">＄ <span>Monetization</span></button><hr><button class="studionav" onclick="studioPage('Settings',this)">⚙ <span>Settings</span></button></aside><div class="studioarea" id="studioArea"></div></div></section>
<script>
const videos=[
['A Day Exploring the Mountains','Wander More','1.2M views · 2 days ago','12:48','Travel','photo-1464822759023-fed622ff2c3b'],
['Building the Ultimate Gaming Setup','TechBench','845K views · 1 day ago','18:22','Technology','photo-1593305841991-05c297ba4575'],
['The Best Moments of the Year','Clips Central','3.4M views · 5 days ago','9:16','Entertainment','photo-1492684223066-81342ee5ff30'],
['Minecraft Survival: Episode 1','PixelCraft','520K views · 3 days ago','24:09','Gaming','photo-1607513746994-51f730a44832'],
['Relaxing Music for Studying','Ambient World','8.1M views · 1 week ago','1:02:14','Music','photo-1470225620780-dba8ba36b745'],
['How the Internet Actually Works','Curious Minds','640K views · 4 days ago','14:35','Technology','photo-1451187580459-43490279c0fa'],
['A Huge Update Is Coming!','Game Updates','210K views · 6 hours ago','11:03','Gaming','photo-1542751371-adc38448a05e'],
['City Life in 2020','Everyday Films','980K views · 1 week ago','7:42','Entertainment','photo-1519608487953-e999c86e7455'],
['Live: Community Hangout','ClipsTube Live','LIVE NOW','LIVE','Live','photo-1524368535928-5b5e00ddc76b'],
['The Science of Space','Beyond Earth','2.7M views · 2 weeks ago','16:51','News','photo-1446776811953-b23d57bd21aa'],
['Indie Game Soundtrack Mix','Sound Station','430K views · 2 days ago','35:20','Music','photo-1511379938547-c1f69419868d'],
['Can This Old Computer Still Game?','Retro Tech','390K views · 6 days ago','20:14','Technology','photo-1518770660439-4636190af475']
].map((v,i)=>({id:i,title:v[0],channel:v[1],meta:v[2],duration:v[3],category:v[4],img:v[5]}));
let currentFilter='All';
const img=(id)=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w=640&q=80';
function renderVideos(list=videos){document.getElementById('videoGrid').innerHTML=list.map(v=>`<article class="video" onclick="watch(${v.id})"><div class="thumb"><img loading="lazy" src="${img(v.img)}"><span class="duration">${v.duration}</span></div><div class="vmeta"><div class="channelpic">${v.channel[0]}</div><div><div class="vtitle">${v.title}</div><div class="muted">${v.channel}<br>${v.meta}</div></div></div></article>`).join('')||'<div class="empty">No videos found.</div>'}
function filterVideos(cat){currentFilter=cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.textContent===cat));renderVideos(cat==='All'?videos:videos.filter(v=>v.category===cat))}
function go(page){document.getElementById('studio').classList.add('hidden');document.getElementById('main').classList.remove('hidden');document.getElementById('sidebar').classList.remove('hidden');if(page==='studio'){document.getElementById('main').classList.add('hidden');document.getElementById('sidebar').classList.add('hidden');document.getElementById('studio').classList.remove('hidden');studioPage('Dashboard');return}if(page==='watch')return;document.getElementById('chips').classList.toggle('hidden',!['home','trending','subscriptions'].includes(page));document.querySelectorAll('.navitem[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='home'||page==='trending'||page==='subscriptions'){renderVideos(page==='subscriptions'?videos.slice(0,6):videos);return}document.getElementById('videoGrid').innerHTML='<div class="empty" style="grid-column:1/-1"><h3>'+({library:'Your library',history:'Watch history','your-videos':'Your videos'}[page]||'Explore')+'</h3><p>This section is ready for your ClipsTube account features.</p><button class="upload" onclick="go(\'studio\')">Open Studio</button></div>'}
function watch(id){const v=videos.find(x=>x.id===id);document.getElementById('chips').classList.add('hidden');document.getElementById('videoGrid').innerHTML=`<div class="watchlayout" style="grid-column:1/-1"><div><div class="player"><div class="playbig">▶</div><div class="playerbar"></div></div><div class="watchtitle">${v.title}</div><div class="watchstats"><span>${v.meta}</span><div class="actions"><button class="action" onclick="toast('Liked')">👍 LIKE</button><button class="action" onclick="toast('Link copied')">↗ SHARE</button><button class="action" onclick="toast('Saved to Library')">▤ SAVE</button></div></div><div class="channelrow"><div class="channelpic" style="width:48px;height:48px">${v.channel[0]}</div><div><strong>${v.channel}</strong><div class="muted">1.24M subscribers</div></div><button class="subscribe" onclick="this.textContent=this.textContent==='SUBSCRIBED'?'SUBSCRIBE':'SUBSCRIBED'">SUBSCRIBE</button></div><div class="description">${v.title}<br><br>Welcome to ${v.channel}! Thanks for watching. Subscribe for more videos and updates.</div><h3>Comments</h3><div class="empty">Comments will appear here.</div></div><aside><div class="upnext">Up next <span style="float:right;color:#777;font-weight:400">AUTOPLAY ◉</span></div>${videos.filter(x=>x.id!==id).slice(0,8).map(x=>`<div class="suggestion" onclick="watch(${x.id})"><img src="${img(x.img)}"><div><div class="vtitle">${x.title}</div><div class="muted">${x.channel}<br>${x.meta}</div></div></div>`).join('')}</aside></div>`;}
function studioPage(name,el){document.getElementById('studioSection').textContent=name;document.querySelectorAll('.studionav').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');else document.querySelector('.studionav').classList.add('active');const area=document.getElementById('studioArea');const content={
Dashboard:`<div class="welcome"><div><h1 class="studiotitle">Channel dashboard</h1><div class="muted">Welcome back! Here's what's happening with your channel.</div></div><button class="upload" onclick="toast('Upload flow coming soon')">＋ CREATE</button></div><div class="statsgrid"><div class="panel"><h3>Channel analytics</h3><div class="muted">Current subscribers</div><div class="bigstat">12,458</div><div class="muted">+128 in last 28 days</div></div><div class="panel"><h3>Views · Last 28 days</h3><div class="bigstat">184.2K</div><div class="muted">↑ 12.4% from previous 28 days</div></div><div class="panel"><h3>Watch time (hours)</h3><div class="bigstat">9.8K</div><div class="muted">↑ 8.2% from previous 28 days</div></div></div><div class="dashboardgrid"><div class="panel"><h3>Latest video performance</h3><div class="activity"><img src="${img(videos[0].img)}"><div><strong>${videos[0].title}</strong><p class="muted">First 7 days 3 hours</p><div class="muted">Views&nbsp;&nbsp; 24.8K<br>Impressions click-through rate&nbsp;&nbsp; 6.2%</div></div></div></div><div class="panel"><h3>News</h3><p>Welcome to your creator dashboard.</p><p class="muted">Check your latest channel updates and creator tips here.</p><hr><h3>Recent comments</h3><p class="muted">Your newest community activity will appear here.</p></div></div>`,
Content:`<h1 class="studiotitle">Channel content</h1><div class="studio-tabs"><span class="selected">Videos</span><span>Shorts</span><span>Live</span><span>Playlists</span></div><table class="table"><thead><tr><th>Video</th><th>Visibility</th><th>Date</th><th>Views</th><th>Comments</th></tr></thead><tbody>${videos.slice(0,7).map(v=>`<tr><td><div style="display:flex;gap:10px;align-items:center"><img src="${img(v.img)}" width="112"><strong>${v.title}</strong></div></td><td>Public</td><td>Nov 2020</td><td>${v.meta.split(' ')[0]}</td><td>128</td></tr>`).join('')}</tbody></table>`,
Analytics:`<h1 class="studiotitle">Channel analytics</h1><div class="studio-tabs"><span class="selected">Overview</span><span>Reach</span><span>Engagement</span><span>Audience</span></div><div class="panel"><div class="muted">Your channel got</div><div class="bigstat">184,231 views</div><div class="muted">Last 28 days</div><div style="height:150px;display:flex;align-items:end;gap:8px;margin-top:20px">${[32,48,42,66,50,80,60,74,95,62,88,72,100,82,91,68,77,98,70,86].map(h=>`<div style="height:${h}%;background:#4285d4;flex:1"></div>`).join('')}</div></div><div class="statsgrid" style="margin-top:14px"><div class="panel"><h3>Watch time</h3><div class="bigstat">9.8K</div><div class="muted">Hours</div></div><div class="panel"><h3>Subscribers</h3><div class="bigstat">+1,284</div><div class="muted">Change</div></div><div class="panel"><h3>Estimated revenue</h3><div class="bigstat">£426.18</div><div class="muted">Demo data</div></div></div>`,
Comments:`<h1 class="studiotitle">Comments</h1><div class="studio-tabs"><span class="selected">Published</span><span>Held for review</span><span>Likely spam</span></div><div class="empty">No comments to display yet.</div>`,
Subtitles:`<h1 class="studiotitle">Channel subtitles</h1><div class="empty">Manage subtitles and captions for your videos here.</div>`,
Copyright:`<h1 class="studiotitle">Copyright</h1><div class="empty">Copyright notices and removal requests will appear here.</div>`,
Monetization:`<h1 class="studiotitle">Monetization</h1><div class="empty">Explore creator monetization features and eligibility information.</div>`,
Settings:`<h1 class="studiotitle">Settings</h1><div class="panel"><h3>Channel settings</h3><p>Channel name: ClipsTube Creator</p><p>Country: United Kingdom</p><p>Default currency: GBP (£)</p><button class="upload" onclick="toast('Settings saved')">Save</button></div>`
};area.innerHTML=content[name]||'<div class="empty">This section is being built.</div>'}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),1800)}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('searchInput').value.toLowerCase().trim();go('home');renderVideos(videos.filter(v=>(v.title+' '+v.channel+' '+v.category).toLowerCase().includes(q)));document.getElementById('chips').classList.add('hidden')});
document.getElementById('menuBtn').addEventListener('click',()=>{const s=document.getElementById('sidebar');s.style.display=s.style.display==='none'?'block':'none'});
renderVideos();
</script></body></html>
